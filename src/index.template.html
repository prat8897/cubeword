<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060913">
<title>CubeWord — the daily 3D crossword</title>
<meta name="description" content="A new crossword wrapped around a cube every day. Words travel over edges and across faces. Drag, solve, share.">
<meta property="og:title" content="CubeWord — the daily 3D crossword">
<meta property="og:description" content="A new crossword wrapped around a cube every day. Words travel over edges and across faces.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237cf5d4'/%3E%3Cstop offset='1' stop-color='%23b693ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 5l23 13v28L32 59 9 46V18z' fill='%230a0f1f' stroke='url(%23g)' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M9 18l23 13 23-13M32 31v28' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/*__CSS__*/
</style>
</head>
<body>
<canvas id="gl" aria-label="Interactive 3D crossword cube"></canvas>

<div id="ui">
  <header id="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs><path d="M32 5l23 13v28L32 59 9 46V18z" fill="rgba(255,255,255,.04)" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/><path d="M9 18l23 13 23-13M32 31v28" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/></svg>
      <div class="brandtext"><b>CUBEWORD</b><span id="dateLabel"></span></div>
    </div>
    <div class="seg" id="sizeSwitch" role="tablist" aria-label="Cube size"><i class="thumb"></i></div>
    <div class="tools">
      <div id="timer" aria-label="Elapsed time">0:00</div>
      <button class="ib" id="btnClues" aria-label="Show clues" title="Clues"></button>
      <button class="ib" id="btnAssist" aria-label="Assist" title="Check &amp; reveal"></button>
      <button class="ib" id="btnStats" aria-label="Stats and archive" title="Stats &amp; archive"></button>
      <a class="ib" id="btnSupport" href="https://buymeacoffee.com/prat8897" target="_blank" rel="noopener" aria-label="Support the developer" title="Buy me a coffee"></a>
      <button class="ib" id="btnHelp" aria-label="How to play" title="How to play"></button>
      <button class="ib" id="btnSettings" aria-label="Settings" title="Settings"></button>
    </div>
  </header>

  <aside id="panel" aria-label="Clues">
    <div class="panelhead">
      <span>Clues</span>
      <div class="prog"><div class="bar"><i id="progBar"></i></div><b id="progText">0/0</b></div>
      <button class="ib sm closepanel" id="btnClosePanel" aria-label="Close clues">✕</button>
    </div>
    <div class="cluelists" id="clueLists"></div>
  </aside>

  <div id="bottom">
    <section id="cluebar" aria-live="polite">
      <button class="nb" id="prevClue" aria-label="Previous clue"></button>
      <div class="cluemain">
        <div class="cluemeta"><span class="chip" id="clueChip"></span><b id="clueNum"></b><span id="clueDir"></span></div>
        <div class="cluetext" id="clueText"></div>
      </div>
      <button class="nb" id="nextClue" aria-label="Next clue"></button>
    </section>
    <div id="kbd" aria-label="On-screen keyboard"></div>
  </div>

  <div id="assistMenu" class="pop" hidden></div>
  <div id="toast" role="status"></div>
</div>

<div id="loader"><div class="lcube"><i>C</i><i>U</i><i>B</i><i>E</i><i>W</i><i>D</i></div><p id="loaderText">Folding today's cube…</p></div>
<div id="modalRoot"></div>
<div id="fatal" hidden></div>
<noscript><div style="position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#050812;color:#eef1fb;font-family:Georgia,serif;padding:30px;z-index:200"><h2>CubeWord needs JavaScript</h2><p>It draws a real 3D cube in your browser.</p></div></noscript>

<script id="app">
/*__BUNDLE__*/
</script>
</body>
</html>
